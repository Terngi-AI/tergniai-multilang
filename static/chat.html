<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terngi AI Chat</title>
<link rel="stylesheet" href="/static/chat.css">
</head>
<body>
<header>
  <h1>Terngi <span>AI</span></h1>

  <label><span data-i18n="uiLangLabel">Interface:</span>
    <select id="ui-language" aria-label="Interface language">
      <option value="en">English</option>
      <option value="yo">Yorùbá</option>
      <option value="ha">Hausa</option>
      <option value="ig">Igbo</option>
      <option value="pcm">Naijá (Pidgin)</option>
      <option value="sw">Kiswahili</option>
    </select>
  </label>

  <label><span data-i18n="replyInLabel">Reply in</span>
    <select id="reply-language" aria-label="Reply language">
      <option value="" data-i18n="sameLanguageOption">Same language as me</option>
    </select>
  </label>
  <div class="spacer"></div>
  <button id="new-chat" type="button" data-i18n="newChat">New chat</button>
  <details>
    <summary data-i18n="settings">Settings</summary>
    <label><span data-i18n="apiKeyLabel">API key</span> <input id="api-key" type="password" autocomplete="off" aria-label="API key" data-i18n-attr="placeholder:apiKeyPlaceholder" placeholder="Only if the server requires one"></label>
    <label><input id="remember-key" type="checkbox" aria-label="Remember on this device"> <span data-i18n="rememberKey">Remember on this device</span></label>
    <button id="forget-key" type="button" data-i18n="forgetKey">Forget key</button>
    <div class="privacy-actions">
      <button id="delete-chats" type="button" data-i18n="deleteChats">Delete my chats</button>
      <span class="privacy-status" id="delete-status" role="status"></span>
    </div>
  </details>
</header>

<main id="scroll" tabindex="0" aria-label="Chat transcript">
  <div class="thread" id="thread">
    <div class="welcome" id="welcome">
      <h2>Ẹ káàbọ̀ · Sannu · Nnọọ · Karibu · Sawubona</h2>
      <p data-i18n="welcomeSub">Chat with Terngi AI about anything, in your own language.</p>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Messages"></div>
  </div>
</main>

<footer>
  <form id="composer" aria-label="Message composer">
    <textarea id="input" rows="1" data-i18n-attr="placeholder:inputPlaceholder,aria-label:inputAriaLabel" placeholder="Message Terngi AI…" aria-label="Message" aria-describedby="input-hint"></textarea>
    <button class="primary" id="send" type="submit" data-i18n="send">Send</button>
  </form>
  <div class="hint" id="input-hint" data-i18n="hint">Enter to send · Shift+Enter for a new line. Conversations are kept on the server for 24 hours.</div>
</footer>

<script src="/static/chat.js" defer></script>
</body>
</html>
