<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terngi AI Chat</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e4e3de; --accent: #0f7b5f; --accent-text: #ffffff;
    --user-bubble: #0f7b5f; --user-text: #ffffff; --bot-bubble: #ffffff; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --text: #ecebe6; --muted: #a09f98;
      --border: #33322f; --accent: #3fb68f; --accent-text: #0b1f18;
      --user-bubble: #2a6b56; --user-text: #f2fffa; --bot-bubble: #1e1e1c; --error: #f97066;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; row-gap: 8px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  select, button, input, textarea { font: inherit; color: inherit; }
  select, input {
    max-width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px;
  }
  button {
    max-width: 100%; border: 1px solid var(--border); background: var(--panel); border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  select { min-width: 0; }
  main { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 16px; }
  .thread { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; }
  .messages { display: flex; flex-direction: column; gap: 14px; }
  .welcome { text-align: center; color: var(--muted); margin-top: 8vh; margin-bottom: 14px; }
  .welcome h2 { color: var(--text); font-size: 22px; margin-bottom: 4px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .suggestions button { max-width: 100%; overflow-wrap: anywhere; font-size: 14px; border-radius: 999px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; color: var(--error); border: 1px solid var(--error); background: transparent; }
  .msg code { font-family: ui-monospace, Menlo, monospace; font-size: 14px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .feedback {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-top: 8px; font-size: 13px; color: var(--muted);
  }
  .feedback button { padding: 3px 9px; border-radius: 999px; background: var(--bg); }
  .feedback-panel {
    flex: 1 1 100%; display: flex; flex-direction: column; gap: 8px;
    margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .feedback-panel .notice { margin: 0; font-size: 12px; color: var(--muted); }
  .feedback-panel textarea { width: 100%; min-height: 58px; flex: none; }
  .feedback-panel .consent { align-items: flex-start; font-size: 13px; }
  .feedback-panel .consent input { margin-top: 3px; }
  .feedback-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .feedback-status { font-size: 12px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 14px; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  form { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1 1 12rem; min-width: 0; resize: none; max-height: 180px; min-height: 44px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
  }
  :where(button, select, input, textarea, summary, a[href], [tabindex]):focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  ::placeholder { color: var(--muted); opacity: 1; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
  details { font-size: 14px; }
  details[open] { width: 100%; }
  details label { align-items: stretch; flex-wrap: wrap; }
  #api-key { flex: 1 1 100%; min-width: 0; }
  .privacy-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .privacy-status { font-size: 12px; color: var(--muted); }
  @media (max-width: 600px) {
    .msg { max-width: 92%; }
    header { align-items: flex-start; }
    header h1 { width: 100%; }
    .spacer { display: none; }
    details[open] { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Terngi <span>AI</span></h1>

  <label><span data-i18n="uiLangLabel">Interface:</span>
    <select id="ui-language" aria-label="Interface language">
      <option value="en">English</option>
      <option value="yo">Yorùbá</option>
      <option value="ha">Hausa</option>
      <option value="ig">Igbo</option>
      <option value="pcm">Naijá (Pidgin)</option>
      <option value="sw">Kiswahili</option>
    </select>
  </label>

  <label><span data-i18n="replyInLabel">Reply in</span>
    <select id="reply-language" aria-label="Reply language">
      <option value="" data-i18n="sameLanguageOption">Same language as me</option>
    </select>
  </label>
  <div class="spacer"></div>
  <button id="new-chat" type="button" data-i18n="newChat">New chat</button>
  <details>
    <summary data-i18n="settings">Settings</summary>
    <label><span data-i18n="apiKeyLabel">API key</span> <input id="api-key" type="password" autocomplete="off" aria-label="API key" data-i18n-attr="placeholder:apiKeyPlaceholder" placeholder="Only if the server requires one"></label>
    <div class="privacy-actions">
      <button id="delete-chats" type="button" data-i18n="deleteChats">Delete my chats</button>
      <span class="privacy-status" id="delete-status" role="status"></span>
    </div>
  </details>
</header>

<main id="scroll" tabindex="0" aria-label="Chat transcript">
  <div class="thread" id="thread">
    <div class="welcome" id="welcome">
      <h2>Ẹ káàbọ̀ · Sannu · Nnọọ · Karibu · Sawubona</h2>
      <p data-i18n="welcomeSub">Chat with Terngi AI about anything, in your own language.</p>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Messages"></div>
  </div>
</main>

<footer>
  <form id="composer" aria-label="Message composer">
    <textarea id="input" rows="1" data-i18n-attr="placeholder:inputPlaceholder,aria-label:inputAriaLabel" placeholder="Message Terngi AI…" aria-label="Message" aria-describedby="input-hint"></textarea>
    <button class="primary" id="send" type="submit" data-i18n="send">Send</button>
  </form>
  <div class="hint" id="input-hint" data-i18n="hint">Enter to send · Shift+Enter for a new line. Conversations are kept on the server for 24 hours.</div>
</footer>

<script>
(() => {
  const TRANSLATIONS = {
    en: {
      uiLangLabel: "Interface:",
      replyInLabel: "Reply in",
      sameLanguageOption: "Same language as me",
      newChat: "New chat",
      settings: "Settings",
      apiKeyLabel: "API key",
      apiKeyPlaceholder: "Only if the server requires one",
      welcomeSub: "Chat with Terngi AI about anything, in your own language.",
      inputPlaceholder: "Message Terngi AI…",
      inputAriaLabel: "Message",
      send: "Send",
      hint: "Enter to send · Shift+Enter for a new line. Conversations are kept on the server for 24 hours.",
      typing: "Terngi AI is thinking…",
      usingTool: "Terngi AI is using",
      newChatGreeting: "New conversation started. What would you like to talk about?",
      expiredError: "That conversation expired. Your next message starts a new one.",
      genericError: "Something went wrong.",
      networkError: "Couldn't reach the server. Check your connection and try again.",
      usedTools: "used",
      deleteChats: "Delete my chats",
      deleteConfirm: "Delete all your chats from the server? This cannot be undone.",
      deletingChats: "Deleting…",
      deletedChats: "Deleted {n} conversations.",
      deletedChatsNone: "No stored chats to delete.",
      deleteNeedsKey: "Delete-all requires an API key. Enter yours in Settings."
    },
    yo: {
      uiLangLabel: "Èdè UI:",
      replyInLabel: "Dáhùn ní",
      sameLanguageOption: "Èdè kan náà pẹ̀lú mi",
      newChat: "Ọ̀rọ̀ tuntun",
      settings: "Ètò",
      apiKeyLabel: "Kọ́kọ́rọ́ API",
      apiKeyPlaceholder: "Kìkì tí olupin bá béèrè fún un",
      welcomeSub: "Bá Terngi AI sọ̀rọ̀ nípa ohunkóhun, ní èdè rẹ.",
      inputPlaceholder: "Firanṣẹ́ sí Terngi AI…",
      inputAriaLabel: "Ifiranṣẹ́",
      send: "Firanṣẹ́",
      hint: "Enter láti firanṣẹ́ · Shift+Enter fún ìlà tuntun. Ìjíròrò yóò wà lórí olupin fún wákàtí 24.",
      typing: "Terngi AI ń rò ó…",
      usingTool: "Terngi AI ń lo",
      newChatGreeting: "Ìjíròrò tuntun ti bẹ̀rẹ̀. Kí ni o fẹ́ ká sọ̀rọ̀ nípa rẹ̀?",
      expiredError: "Ìjíròrò yẹn ti parí. Ìfiranṣẹ́ rẹ tí ó kàn yóò bẹ̀rẹ̀ tuntun.",
      genericError: "Nǹkan kan tọsẹ.",
      networkError: "Kò lè dé ọ̀dọ̀ olupin. Yẹ asopọ rẹ wò kí o tún gbìyànjú.",
      usedTools: "lo"
    },
    ha: {
      uiLangLabel: "Harshen shafi:",
      replyInLabel: "Amsa a",
      sameLanguageOption: "Harshe ɗaya da ni",
      newChat: "Sabuwar hira",
      settings: "Saituna",
      apiKeyLabel: "Mabuɗin API",
      apiKeyPlaceholder: "Idan har uwar garken na buƙata kawai",
      welcomeSub: "Yi hira da Terngi AI game da komai, cikin yarenka.",
      inputPlaceholder: "Aika saƙo zuwa Terngi AI…",
      inputAriaLabel: "Saƙo",
      send: "Aika",
      hint: "Danna Enter don aikawa · Shift+Enter don sabon layi. Ana adana hirarraki na tsawon awanni 24.",
      typing: "Terngi AI yana tunani…",
      usingTool: "Terngi AI yana amfani da",
      newChatGreeting: "An fara sabuwar hira. Me kuke so mu tattauna akai?",
      expiredError: "Waccan hirar ta ƙare. Saƙonku na gaba zai fara sabuwa.",
      genericError: "Wani abu ya sami matsala.",
      networkError: "An kasa isa ga uwar garken. Duba hanyar sadarwarka sannan ka sake gwadawa.",
      usedTools: "anyi amfani da"
    },
    ig: {
      uiLangLabel: "Asụsụ Ihuenyo:",
      replyInLabel: "Zaa na",
      sameLanguageOption: "Otu asụsụ ahụ m ji dee",
      newChat: "Mkparịta ụka ọhụrụ",
      settings: "Ntọala",
      apiKeyLabel: "Igodo API",
      apiKeyPlaceholder: "Naanị ma sava chọrọ ya",
      welcomeSub: "Kparịta ụka na Terngi AI gbasara ihe ọ bụla, n'asụsụ gị.",
      inputPlaceholder: "Ziga ozi na Terngi AI…",
      inputAriaLabel: "Ozi",
      send: "Ziga",
      hint: "Enter iji ziga · Shift+Enter maka ahịrị ọhụrụ. A na-edebe mkparịta ụka na sava ruo awa 24.",
      typing: "Terngi AI na-eche echiche…",
      usingTool: "Terngi AI na-eji",
      newChatGreeting: "Amalitere mkparịta ụka ọhụrụ. Kedu ihe ị ga-achọ ka anyị kpaa maka ya?",
      expiredError: "Mkparịta ụka ahụ agwụla. Ozi ọzọ ị ga-eziga ga-amalite nke ọhụrụ.",
      genericError: "Ihe mebiri.",
      networkError: "Enweghị ike iru sava ahụ. Lelee njikọ gị ma nwaa ọzọ.",
      usedTools: "jiri"
    },
    pcm: {
      uiLangLabel: "Language:",
      replyInLabel: "Reply with",
      sameLanguageOption: "The same language wey I use",
      newChat: "New chat",
      settings: "Settings",
      apiKeyLabel: "API key",
      apiKeyPlaceholder: "Only if server need am",
      welcomeSub: "Follow Terngi AI yarn about anything, for your own language.",
      inputPlaceholder: "Message Terngi AI…",
      inputAriaLabel: "Message",
      send: "Send",
      hint: "Enter to send · Shift+Enter for new line. Server dey keep chat for 24 hours.",
      typing: "Terngi AI dey reason…",
      usingTool: "Terngi AI dey use",
      newChatGreeting: "New gist don start. Wetin you wan talk about?",
      expiredError: "Dat gist don expire. Your next message go start new one.",
      genericError: "Wahala dey.",
      networkError: "Network no reach server. Check your connection try again.",
      usedTools: "use"
    },
    sw: {
      uiLangLabel: "Lugha:",
      replyInLabel: "Jibu kwa",
      sameLanguageOption: "Lugha sawa na yangu",
      newChat: "Gumzo jipya",
      settings: "Mipangilio",
      apiKeyLabel: "Ufunguo wa API",
      apiKeyPlaceholder: "Ikiwa tu seva inaihitaji",
      welcomeSub: "Zungumza na Terngi AI kuhusu chochote, katika lugha yako.",
      inputPlaceholder: "Tuma ujumbe kwa Terngi AI…",
      inputAriaLabel: "Ujumbe",
      send: "Tuma",
      hint: "Enter kutuma · Shift+Enter kwa mstari mpya. Mazungumzo huwekwa kwenye seva kwa saa 24.",
      typing: "Terngi AI anafikiria…",
      usingTool: "Terngi AI anatumia",
      newChatGreeting: "Mazungumzo mapya yameanza. Ungependa kuzungumza kuhusu nini?",
      expiredError: "Mazungumzo hayo yamekwisha muda wake. Ujumbe wako unaofuata utaanza mapya.",
      genericError: "Hitilafu imetokea.",
      networkError: "Haikuweza kuunganishwa na seva. Angalia mtandao wako kisha ujaribu tena.",
      usedTools: "imetumia"
    }
  };

  const SUPPORTED_LANGS = Object.keys(TRANSLATIONS);

  const messages = document.getElementById("messages");
  const scroller = document.getElementById("scroll");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const replySelect = document.getElementById("reply-language");
  const uiLanguageSelect = document.getElementById("ui-language");
  const apiKeyInput = document.getElementById("api-key");
  let conversationId = null;
  let busy = false;

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  };

  function resolveLanguage() {
    const saved = store.get("terngi.uiLanguage");
    if (saved && SUPPORTED_LANGS.includes(saved)) return saved;
    const nav = (navigator.language || "").split("-")[0].toLowerCase();
    return SUPPORTED_LANGS.includes(nav) ? nav : "en";
  }

  let currentLang = resolveLanguage();

  function applyLanguage(lang) {
    if (!TRANSLATIONS[lang]) lang = "en";
    currentLang = lang;
    store.set("terngi.uiLanguage", lang);
    document.documentElement.lang = lang;
    uiLanguageSelect.value = lang;

    const dict = TRANSLATIONS[lang];

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (dict[key]) el.textContent = dict[key];
    });

    document.querySelectorAll("[data-i18n-attr]").forEach(el => {
      const mappings = el.getAttribute("data-i18n-attr").split(",");
      mappings.forEach(mapping => {
        const [attr, key] = mapping.split(":");
        if (dict[key]) el.setAttribute(attr, dict[key]);
      });
    });
  }

  uiLanguageSelect.value = currentLang;
  applyLanguage(currentLang);
  uiLanguageSelect.addEventListener("change", (e) => applyLanguage(e.target.value));

  apiKeyInput.value = store.get("terngi.apiKey") || "";
  apiKeyInput.addEventListener("change", () => store.set("terngi.apiKey", apiKeyInput.value.trim()));

  const deleteChats = document.getElementById("delete-chats");
  const deleteStatus = document.getElementById("delete-status");
  const t = (key, fallback) => TRANSLATIONS[currentLang][key] || fallback;
  deleteChats.addEventListener("click", async () => {
    if (!window.confirm(t("deleteConfirm", "Delete all your chats from the server? This cannot be undone."))) return;
    deleteChats.disabled = true;
    deleteStatus.textContent = t("deletingChats", "Deleting…");
    try {
      const res = await fetch("/v1/chat", { method: "DELETE", headers: headers() });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        if ((res.status === 401 || res.status === 403) && !apiKeyInput.value.trim()) {
          throw new Error(t("deleteNeedsKey", "Delete-all requires an API key. Enter yours in Settings."));
        }
        throw new Error(data.message || `Could not delete chats (${res.status}).`);
      }
      const data = await res.json();
      conversationId = null;
      messages.replaceChildren();
      deleteStatus.textContent = data.deleted
        ? t("deletedChats", "Deleted {n} conversations.").replace("{n}", data.deleted)
        : t("deletedChatsNone", "No stored chats to delete.");
    } catch (err) {
      deleteStatus.textContent = err.message || "Could not delete chats.";
    } finally {
      deleteChats.disabled = false;
    }
  });

  const suggestions = [
    "Ẹ káàrọ̀! Báwo ni o ṣe lè ràn mí lọ́wọ́ lónìí?",
    "Wetin I fit cook for dinner with rice and beans?",
    "Explain how compound interest works, simply.",
    "Habari! Nisaidie kuandika barua ya kazi.",
  ];
  const suggestionBox = document.getElementById("suggestions");
  for (const text of suggestions) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    b.addEventListener("click", () => { input.value = text; submit(); });
    suggestionBox.appendChild(b);
  }

  fetch("/v1/languages").then(r => r.json()).then(({ languages }) => {
    for (const [code, name] of Object.entries(languages)) {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = name;
      replySelect.appendChild(option);
    }
    replySelect.value = store.get("terngi.replyLanguage") || "";
  }).catch(() => {});
  replySelect.addEventListener("change", () => store.set("terngi.replyLanguage", replySelect.value));

  function render(el, text) {
    el.replaceChildren();
    const parts = text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
    for (const part of parts) {
      if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
        const b = document.createElement("strong"); b.textContent = part.slice(2, -2); el.appendChild(b);
      } else if (part.startsWith("`") && part.endsWith("`") && part.length > 2) {
        const c = document.createElement("code"); c.textContent = part.slice(1, -1); el.appendChild(c);
      } else if (part) {
        el.appendChild(document.createTextNode(part));
      }
    }
  }

  function addMessage(role, text, meta) {
    document.getElementById("welcome")?.remove();
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    render(el, text);
    if (meta) {
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = meta;
      el.appendChild(m);
    }
    messages.appendChild(el);
    scroller.scrollTop = scroller.scrollHeight;
    return el;
  }

  // Optional, opt-in feedback. Nothing is sent until the user ticks the consent box.
  function addFeedback(el, exchange) {
    if (!exchange.from_language || !exchange.to_language) return;

    const box = document.createElement("div");
    box.className = "feedback";
    const label = document.createElement("span");
    label.textContent = "Rate this reply:";
    const good = document.createElement("button");
    good.type = "button";
    good.textContent = "👍";
    good.setAttribute("aria-label", "Good reply");
    const bad = document.createElement("button");
    bad.type = "button";
    bad.textContent = "👎";
    bad.setAttribute("aria-label", "Bad reply");
    const status = document.createElement("span");
    status.className = "feedback-status";
    status.setAttribute("role", "status");
    box.append(label, good, bad, status);
    el.appendChild(box);

    let panel = null;

    function choose(rating) {
      if (panel) { panel.remove(); panel = null; }
      status.textContent = "";

      panel = document.createElement("div");
      panel.className = "feedback-panel";

      const notice = document.createElement("p");
      notice.className = "notice";
      notice.textContent = "Feedback is optional. With your consent it is stored and may be " +
        "published as part of Terngi's open evaluation set. Do not include personal information.";

      const correction = document.createElement("textarea");
      correction.rows = 2;
      correction.placeholder = "Suggest a better reply (optional)";
      correction.setAttribute("aria-label", "Suggest a better reply");

      const consentLabel = document.createElement("label");
      consentLabel.className = "consent";
      const consent = document.createElement("input");
      consent.type = "checkbox";
      const consentText = document.createElement("span");
      consentText.textContent = "I agree that this feedback may be stored and published in the " +
        "open evaluation set.";
      consentLabel.append(consent, consentText);

      const actions = document.createElement("div");
      actions.className = "feedback-actions";
      const submit = document.createElement("button");
      submit.type = "button";
      submit.className = "primary";
      submit.textContent = "Send feedback";
      submit.disabled = true;
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.textContent = "Cancel";
      actions.append(submit, cancel);

      consent.addEventListener("change", () => { submit.disabled = !consent.checked; });
      cancel.addEventListener("click", () => { panel?.remove(); panel = null; });

      submit.addEventListener("click", async () => {
        if (!consent.checked) return;
        submit.disabled = true;
        submit.textContent = "Sending…";
        const body = {
          source_text: exchange.source_text,
          translated_text: exchange.translated_text,
          from_language: exchange.from_language,
          to_language: exchange.to_language,
          provider: "chat",
          rating,
          consent: true,
        };
        const better = correction.value.trim();
        if (better) body.correction = better;
        try {
          const res = await fetch("/v1/feedback", {
            method: "POST", headers: headers(), body: JSON.stringify(body),
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.message || `Could not send feedback (${res.status}).`);
          }
          panel?.remove(); panel = null;
          good.disabled = true; bad.disabled = true;
          status.textContent = "Thanks for the feedback.";
        } catch (err) {
          status.textContent = err.message || "Could not send feedback.";
          submit.disabled = false;
          submit.textContent = "Try again";
        }
      });

      panel.append(notice, correction, consentLabel, actions);
      box.appendChild(panel);
      correction.focus();
    }

    good.addEventListener("click", () => choose("good"));
    bad.addEventListener("click", () => choose("bad"));
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  document.getElementById("composer").addEventListener("submit", e => { e.preventDefault(); submit(); });

  document.getElementById("new-chat").addEventListener("click", () => {
    if (conversationId) {
      fetch(`/v1/chat/${conversationId}`, { method: "DELETE", headers: headers() }).catch(() => {});
    }
    conversationId = null;
    messages.replaceChildren();
    addMessage("bot", TRANSLATIONS[currentLang].newChatGreeting);
    input.focus();
  });

  function headers() {
    const h = { "Content-Type": "application/json" };
    const key = apiKeyInput.value.trim();
    if (key) h["X-API-Key"] = key;
    return h;
  }

  async function readEvents(stream, onEvent) {
    const reader = stream.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let currentEvent = "message";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const line of lines) {
        if (line.startsWith("event: ")) {
          currentEvent = line.slice(7).trim();
        } else if (line.startsWith("data: ")) {
          const payload = line.slice(6).trim();
          if (payload) {
            try {
              onEvent(currentEvent, JSON.parse(payload));
            } catch {}
          }
          currentEvent = "message";
        }
      }
    }
  }

  async function submit() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true;
    input.value = ""; autosize();
    addMessage("user", text);

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = TRANSLATIONS[currentLang].typing;
    messages.appendChild(typing);
    scroller.scrollTop = scroller.scrollHeight;

    const body = { message: text };
    if (conversationId) body.conversation_id = conversationId;
    if (replySelect.value) body.reply_language = replySelect.value;

    let bubble = null;
    let streamed = "";
    const usedTools = new Set();
    const ensureBubble = () => {
      if (!bubble) {
        bubble = addMessage("bot", "");
        messages.appendChild(typing);
      }
      return bubble;
    };

    try {
      const res = await fetch("/v1/chat/stream", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(body),
      });

      if (res.status === 404 && conversationId) {
        typing.remove();
        conversationId = null;
        addMessage("error", TRANSLATIONS[currentLang].expiredError);
        return;
      }

      if (!res.ok) {
        typing.remove();
        const data = await res.json().catch(() => ({}));
        addMessage("error", data.message || `${TRANSLATIONS[currentLang].genericError} (${res.status}).`);
        return;
      }

      await readEvents(res.body, (event, data) => {
        if (event === "start") {
          conversationId = data.conversation_id;
        } else if (event === "token") {
          streamed += data.text;
          ensureBubble().textContent = streamed;
          scroller.scrollTop = scroller.scrollHeight;
        } else if (event === "discard") {
          streamed = "";
          if (bubble) bubble.textContent = "";
        } else if (event === "tool") {
          usedTools.add(data.tool);
          typing.textContent = `${TRANSLATIONS[currentLang].usingTool} ${data.tool.replace(/_/g, " ")}…`;
        } else if (event === "done") {
          conversationId = data.conversation_id;
          if (bubble) { bubble.remove(); bubble = null; }
          typing.remove();
          const meta = usedTools.size ? `${TRANSLATIONS[currentLang].usedTools}: ${[...usedTools].join(", ")}` : null;
          const replyBubble = addMessage("bot", data.reply, meta);
          addFeedback(replyBubble, {
            source_text: text,
            translated_text: data.reply,
            from_language: data.language,
            to_language: data.reply_language,
          });
        } else if (event === "error") {
          bubble?.remove();
          bubble = null;
          typing.remove();
          addMessage("error", data.message || TRANSLATIONS[currentLang].genericError);
        }
      });
    } catch (err) {
      if (typing.parentNode) typing.remove();
      addMessage("error", TRANSLATIONS[currentLang].networkError);
    } finally {
      busy = false; send.disabled = false; input.focus();
    }
  }

  input.focus();
})();
</script>
</body>
</html>
