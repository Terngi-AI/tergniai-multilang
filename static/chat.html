<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terngi AI Chat</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e4e3de; --accent: #0f7b5f; --accent-text: #ffffff;
    --user-bubble: #0f7b5f; --user-text: #ffffff; --bot-bubble: #ffffff; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --text: #ecebe6; --muted: #a09f98;
      --border: #33322f; --accent: #3fb68f; --accent-text: #0b1f18;
      --user-bubble: #2a6b56; --user-text: #f2fffa; --bot-bubble: #1e1e1c; --error: #f97066;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  select, button, input, textarea { font: inherit; color: inherit; }
  select, input {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px;
  }
  button {
    border: 1px solid var(--border); background: var(--panel); border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .welcome { text-align: center; color: var(--muted); margin-top: 8vh; }
  .welcome h2 { color: var(--text); font-size: 22px; margin-bottom: 4px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .suggestions button { font-size: 14px; border-radius: 999px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; color: var(--error); border: 1px solid var(--error); background: transparent; }
  .msg code { font-family: ui-monospace, Menlo, monospace; font-size: 14px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 14px; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 180px; min-height: 44px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
  }
  textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
  details { font-size: 14px; }
  details[open] { width: 100%; }
  @media (max-width: 600px) { .msg { max-width: 92%; } header h1 { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Terngi <span>AI</span></h1>
  <label>Reply in
    <select id="reply-language" aria-label="Reply language">
      <option value="">Same language as me</option>
    </select>
  </label>
  <div class="spacer"></div>
  <button id="new-chat" type="button">New chat</button>
  <details>
    <summary>Settings</summary>
    <label>API key <input id="api-key" type="password" autocomplete="off" placeholder="Only if the server requires one"></label>
  </details>
</header>

<main id="scroll">
  <div class="thread" id="thread">
    <div class="welcome" id="welcome">
      <h2>Ẹ káàbọ̀ · Sannu · Nnọọ · Karibu · Sawubona</h2>
      <p>Chat with Terngi AI about anything, in any of 14 languages.</p>
      <div class="suggestions" id="suggestions"></div>
    </div>
  </div>
</main>

<footer>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message Terngi AI…" aria-label="Message"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
  <div class="hint">Enter to send · Shift+Enter for a new line. Conversations are kept on the server for 24 hours.</div>
</footer>

<script>
(() => {
  const thread = document.getElementById("thread");
  const scroller = document.getElementById("scroll");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const replySelect = document.getElementById("reply-language");
  const apiKeyInput = document.getElementById("api-key");
  let conversationId = null;
  let busy = false;

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  };
  apiKeyInput.value = store.get("terngi.apiKey") || "";
  apiKeyInput.addEventListener("change", () => store.set("terngi.apiKey", apiKeyInput.value.trim()));

  const suggestions = [
    "Ẹ káàrọ̀! Báwo ni o ṣe lè ràn mí lọ́wọ́ lónìí?",
    "Wetin I fit cook for dinner with rice and beans?",
    "Explain how compound interest works, simply.",
    "Habari! Nisaidie kuandika barua ya kazi.",
  ];
  const suggestionBox = document.getElementById("suggestions");
  for (const text of suggestions) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    b.addEventListener("click", () => { input.value = text; submit(); });
    suggestionBox.appendChild(b);
  }

  fetch("/v1/languages").then(r => r.json()).then(({ languages }) => {
    for (const [code, name] of Object.entries(languages)) {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = name;
      replySelect.appendChild(option);
    }
    replySelect.value = store.get("terngi.replyLanguage") || "";
  }).catch(() => {});
  replySelect.addEventListener("change", () => store.set("terngi.replyLanguage", replySelect.value));

  // Render **bold** and `code` safely (text only, no HTML injection)
  function render(el, text) {
    const parts = text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
    for (const part of parts) {
      if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
        const b = document.createElement("strong"); b.textContent = part.slice(2, -2); el.appendChild(b);
      } else if (part.startsWith("`") && part.endsWith("`") && part.length > 2) {
        const c = document.createElement("code"); c.textContent = part.slice(1, -1); el.appendChild(c);
      } else if (part) {
        el.appendChild(document.createTextNode(part));
      }
    }
  }

  function addMessage(role, text, meta) {
    document.getElementById("welcome")?.remove();
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    render(el, text);
    if (meta) {
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = meta;
      el.appendChild(m);
    }
    thread.appendChild(el);
    scroller.scrollTop = scroller.scrollHeight;
    return el;
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  document.getElementById("composer").addEventListener("submit", e => { e.preventDefault(); submit(); });

  document.getElementById("new-chat").addEventListener("click", () => {
    if (conversationId) {
      fetch(`/v1/chat/${conversationId}`, { method: "DELETE", headers: headers() }).catch(() => {});
    }
    conversationId = null;
    thread.replaceChildren();
    addMessage("bot", "New conversation started. What would you like to talk about?");
    input.focus();
  });

  function headers() {
    const h = { "Content-Type": "application/json" };
    const key = apiKeyInput.value.trim();
    if (key) h["X-API-Key"] = key;
    return h;
  }

  async function submit() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true;
    input.value = ""; autosize();
    addMessage("user", text);
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = "Terngi AI is thinking…";
    thread.appendChild(typing);
    scroller.scrollTop = scroller.scrollHeight;

    const body = { message: text };
    if (conversationId) body.conversation_id = conversationId;
    if (replySelect.value) body.reply_language = replySelect.value;

    try {
      const res = await fetch("/v1/chat", { method: "POST", headers: headers(), body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      typing.remove();
      if (res.status === 404 && conversationId) {
        conversationId = null;
        addMessage("error", "That conversation expired. Your next message starts a new one.");
      } else if (!res.ok) {
        addMessage("error", data.message || `Something went wrong (${res.status}).`);
      } else {
        conversationId = data.conversation_id;
        const tools = [...new Set(data.steps.map(s => s.tool))];
        const meta = tools.length ? `used: ${tools.join(", ")}` : "";
        addMessage("bot", data.reply, meta);
      }
    } catch (err) {
      typing.remove();
      addMessage("error", "Couldn't reach the server. Check your connection and try again.");
    } finally {
      busy = false; send.disabled = false; input.focus();
    }
  }

  input.focus();
})();
</script>
</body>
</html>
