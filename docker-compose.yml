# Local stack: the API and Redis (shared cache, rate limits and conversations).
# Add MORENA (free African-language model) with:
#   docker compose --profile morena up
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MORENA_BASE_URL: http://morena:8080
      REDIS_URL: redis://redis:6379/0
      # Comma-separated proxy IPs/CIDRs allowed to set X-Forwarded-For
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    # Not published to the host: only the API can reach it.
    # volatile-lru is a safety net for the local stack: all application keys have a TTL.
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--appendonly",
        "no",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  morena:
    profiles: [morena]
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --hf-repo
      - vamboai/morena-1.5b-instruct-gguf
      - --hf-file
      - morena-1.5b-instruct-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "4096"
    volumes:
      - morena-models:/root/.cache/llama.cpp
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  morena-models:
  redis-data:
