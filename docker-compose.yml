# Local stack: the API and Redis (shared cache, rate limits and conversations).
# Add MORENA (free African-language model) with:
#   docker compose --profile morena up
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MORENA_BASE_URL: http://morena:8080
      REDIS_URL: redis://redis:6379/0
      # Comma-separated proxy IPs/CIDRs allowed to set X-Forwarded-For
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    # Pinned by digest (multi-arch manifest list) for reproducible local stacks.
    # Bump tag+digest together as described in CONTRIBUTING.md.
    image: redis:8.2-alpine@sha256:d1389b3f3f981460b9b0918c4d7390c6e9decb8c69b9f09a02e1b6fd7554ade7
    # Not published to the host: only the API can reach it.
    # No persistence: everything in Redis (conversations, WhatsApp memory, translation
    # cache) is short-lived by design, and losing it on restart is acceptable. Keeping
    # snapshots (RDB) would write chat text to disk and in a volume that outlives the
    # keys' TTL, extending retention beyond what is documented.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    restart: unless-stopped

  morena:
    profiles: [morena]
    # Versioned llama.cpp build pinned by digest: `server` moves on every upstream build,
    # so pin the exact build (server-b11854) and its digest. Bump together per CONTRIBUTING.md.
    image: ghcr.io/ggml-org/llama.cpp:server-b11854@sha256:20c4196fc08b459a34ef78aaa05b101333b2fac687e30ec99f37b3c9dc071b44
    command:
      - --hf-repo
      - vamboai/morena-1.5b-instruct-gguf
      - --hf-file
      - morena-1.5b-instruct-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "4096"
    volumes:
      - morena-models:/root/.cache/llama.cpp
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  morena-models:
