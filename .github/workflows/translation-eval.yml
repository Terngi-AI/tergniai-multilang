name: Translation eval

# Scores translation quality on the native-speaker set (data/terngi-eval, #14) against a
# deployed API with real providers, so prompt, model and provider changes can be compared.
# Manual only: it costs provider quota. It reuses the `injection-eval` environment (required
# reviewers, EVAL_API_URL variable, EVAL_API_KEY secret) from the injection evaluation.

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated language codes (empty = every supported language)"
        default: ""
        required: false
      include_unreviewed:
        description: "Also score references not yet reviewed by a second native speaker"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: translation-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Translation quality (chrF++)
    if: github.repository == 'Terngi-AI/tergniai-multilang'
    runs-on: ubuntu-latest
    environment: injection-eval
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install --require-hashes -r requirements.lock
      - name: Score translations
        env:
          EVAL_API_URL: ${{ vars.EVAL_API_URL }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          LANGUAGES: ${{ inputs.languages }}
          INCLUDE_UNREVIEWED: ${{ inputs.include_unreviewed }}
        run: |
          args=(--output translation-report.json)
          if [ -n "$LANGUAGES" ]; then args+=(--languages "$LANGUAGES"); fi
          if [ "$INCLUDE_UNREVIEWED" = "true" ]; then args+=(--include-unreviewed); fi
          python scripts/eval_translation.py "${args[@]}"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: translation-report
          path: translation-report.json
          if-no-files-found: ignore
          retention-days: 90
