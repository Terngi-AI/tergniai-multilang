name: Injection eval

# Runs the prompt-injection regression set (eval/injection/cases.jsonl, #170) against a
# deployed API with real providers. It costs provider quota, so it runs weekly and on
# demand, only in this repository, and only after approval: the `injection-eval`
# environment must have required reviewers. It never runs on pull requests.
#
# Setup (repository settings):
# - Environment `injection-eval` with required reviewers
# - Variable EVAL_API_URL: the base URL of the deployment under test (e.g. staging)
# - Secrets EVAL_API_KEY (a key in that deployment's API_KEYS) and PROMPT_CANARY (the same
#   value as that deployment's PROMPT_CANARY)

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      min_pass_rate:
        description: "Fail the run below this pass rate (0-1)"
        default: "0.9"
        required: false

permissions:
  contents: read

concurrency:
  group: injection-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Prompt-injection regression
    if: github.repository == 'Terngi-AI/tergniai-multilang'
    runs-on: ubuntu-latest
    environment: injection-eval
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install --require-hashes -r requirements.lock
      - name: Run the injection cases
        env:
          EVAL_API_URL: ${{ vars.EVAL_API_URL }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          PROMPT_CANARY: ${{ secrets.PROMPT_CANARY }}
          MIN_PASS_RATE: ${{ inputs.min_pass_rate || '0.9' }}
        run: >-
          python scripts/eval_injection.py
          --output injection-report.json
          --min-pass-rate "$MIN_PASS_RATE"
      - name: Run the honesty cases (#145)
        if: always()
        env:
          EVAL_API_URL: ${{ vars.EVAL_API_URL }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          PROMPT_CANARY: ${{ secrets.PROMPT_CANARY }}
          MIN_PASS_RATE: ${{ inputs.min_pass_rate || '0.9' }}
        run: >-
          python scripts/eval_injection.py
          --cases eval/honesty/cases.jsonl
          --output honesty-report.json
          --min-pass-rate "$MIN_PASS_RATE"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: injection-report
          path: |
            injection-report.json
            honesty-report.json
          if-no-files-found: ignore
          retention-days: 30
